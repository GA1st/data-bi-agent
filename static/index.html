<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data BI Agent - 智能数据分析平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- CDN with crossorigin for SRI compatibility. Generate hashes: curl -s URL | openssl dgst -sha384 -binary | openssl base64 -A -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                    <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
                <span class="logo-text">Data BI</span>
            </div>
            <div class="sidebar-nav">
                <button class="nav-item active" onclick="navigate('dashboard')" data-page="dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                    </svg>
                    <span>仪表盘</span>
                </button>
                <button class="nav-item" onclick="navigate('chat')" data-page="chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>AI 对话</span>
                </button>
                <button class="nav-item" onclick="navigate('explorer')" data-page="explorer">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <span>数据探索</span>
                </button>
                <button class="nav-item" onclick="navigate('saved')" data-page="saved">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>保存查询</span>
                </button>
            </div>
            <div class="sidebar-footer">
                <button class="nav-item" onclick="toggleAnomaly()" id="anomalyBtn" title="异常检测开关">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span id="anomalyStatus">异常检测</span>
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-area">
            <!-- Dashboard Page -->
            <div class="page active" id="page-dashboard">
                <div class="page-header">
                    <h1>经营仪表盘</h1>
                    <button class="btn-primary" onclick="refreshDashboard()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                        刷新
                    </button>
                </div>
                <div class="dashboard-content" id="dashboardContent">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- AI Chat Page -->
            <div class="page" id="page-chat">
                <div class="chat-layout">
                    <div class="chat-panel">
                        <div class="chat-suggestions" id="chatSuggestions">
                            <button class="chip" onclick="askSuggestion(this)">本月销售额</button>
                            <button class="chip" onclick="askSuggestion(this)">各区域销售排名</button>
                            <button class="chip" onclick="askSuggestion(this)">销量TOP10产品</button>
                            <button class="chip" onclick="askSuggestion(this)">客户增长趋势</button>
                            <button class="chip" onclick="askSuggestion(this)">检测异常订单</button>
                            <button class="chip" onclick="askSuggestion(this)">各品类销售占比</button>
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            <div class="welcome-message">
                                <h2>AI 数据分析助手</h2>
                                <p>用自然语言提问，自动生成SQL、图表和分析报告</p>
                            </div>
                        </div>
                        <div class="chat-input-area">
                            <div class="input-wrapper">
                                <textarea id="chatInput" placeholder="输入你的数据分析问题..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                                <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="22" y1="2" x2="11" y2="13"/>
                                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="input-hint"><span>Enter 发送 / Shift+Enter 换行</span></div>
                        </div>
                    </div>
                    <div class="result-panel">
                        <div class="result-empty" id="resultEmpty">
                            <p>查询结果将在此处展示</p>
                        </div>
                        <div class="result-content" id="resultContent" style="display:none;">
                            <div class="sql-display" id="sqlDisplay" style="display:none;">
                                <div class="sql-header">
                                    <span>生成的SQL</span>
                                    <button class="copy-btn" onclick="copySQL()">复制</button>
                                </div>
                                <code id="sqlCode"></code>
                            </div>
                            <div class="result-tabs">
                                <button class="rtab active" onclick="switchTab('table', this)">表格</button>
                                <button class="rtab" onclick="switchTab('chart', this)">图表</button>
                                <div class="rtab-actions">
                                    <span class="result-info" id="resultInfo"></span>
                                    <button class="action-btn" onclick="exportCSV()">导出CSV</button>
                                    <button class="action-btn" onclick="saveCurrentQuery()">保存查询</button>
                                </div>
                            </div>
                            <div class="tab-content active" id="tableView">
                                <div class="table-container" id="tableContainer"></div>
                            </div>
                            <div class="tab-content" id="chartView">
                                <div class="chart-container" id="chartContainer"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Data Explorer Page -->
            <div class="page" id="page-explorer">
                <div class="page-header">
                    <h1>数据探索</h1>
                </div>
                <div class="explorer-layout">
                    <div class="explorer-sidebar" id="explorerSidebar">
                        <div class="explorer-section-title">数据表</div>
                        <div id="tableList" class="table-list"></div>
                    </div>
                    <div class="explorer-main" id="explorerMain">
                        <div class="explorer-empty">选择左侧的数据表开始探索</div>
                    </div>
                </div>
            </div>

            <!-- Saved Queries Page -->
            <div class="page" id="page-saved">
                <div class="page-header">
                    <h1>保存的查询</h1>
                </div>
                <div class="saved-content" id="savedContent">
                    <div class="explorer-empty">暂无保存的查询。在 AI 对话中点击"保存查询"添加。</div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
