name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --ignore E501 --select E,F,W,I,UP,B,SIM

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/run_tests.py

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t data-bi-agent:ci .
      - name: Smoke test
        run: |
          docker run -d --name bi-test -p 8000:8000 data-bi-agent:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "App is up after ${i}x2s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/ | head -c 100 || (docker logs bi-test && exit 1)
          docker stop bi-test
